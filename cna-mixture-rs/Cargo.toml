[package]
name = "cna-mixture-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "cna_mixture_rs"
crate-type = ["rlib"] # "cdylib"

[dependencies]
statrs = "*"
rayon = "*"
pyo3 = { version = "^0.19.0", features = ["extension-module"] }
numpy = { version = "*" }
ndarray = {version = "0.15", features = ["rayon"] }
once_cell = "1.10"
num_cpus = "1.0"
rand = "0.8.5"
ordered-float = "2.10.0"
itertools = "0.11"
GSL = "*"

[dev-dependencies]
criterion = ">0.4"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
overflow-checks = false
# panic = "abort"

[[bench]]
name = "benchmarks"
harness = false